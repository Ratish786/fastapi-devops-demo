name: Build, Push and Deploy Blue Green

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t biku0786/fastapi-devops-demo:latest .

      - name: Push Docker image
        run: docker push biku0786/fastapi-devops-demo:latest

      - name: Deploy Blue Green
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            sudo docker pull biku0786/fastapi-devops-demo:latest

            sudo docker rm -f fastapi-green || true

            sudo docker run -d \
              --name fastapi-green \
              -p 8001:8000 \
              -e DB_CONNECTION=postgresql+psycopg2://postgres:ratish0786@postgres-db:5432/mydb \
              -e SECRET_KEY=mysecretkey \
              -e ALGORITHM=HS256 \
              -e EXP_TIME=30 \
              --link postgres-db \
              biku0786/fastapi-devops-demo:latest

            sleep 10

            curl -f http://localhost:8001/health || exit 1

            sudo sed -i 's/8000/8001/g' /etc/nginx/sites-available/default
            sudo systemctl reload nginx

            sudo docker rm -f fastapi-app || true